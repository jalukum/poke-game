<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#071018" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>POKE GAME</title>
    <link rel="icon" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <div id="slot-left" class="slot"></div>
      <div id="stage">
        <canvas id="game" width="240" height="160" tabindex="0" aria-label="Game screen"></canvas>
      </div>
      <div id="slot-right" class="slot"></div>
      <div id="slot-bottom" class="slot"></div>
    </div>
    <div id="controls">
      <div id="dpad" class="dpad">
        <button type="button" class="key up" data-dir="up" aria-label="Up"></button>
        <button type="button" class="key left" data-dir="left" aria-label="Left"></button>
        <button type="button" class="key right" data-dir="right" aria-label="Right"></button>
        <button type="button" class="key down" data-dir="down" aria-label="Down"></button>
        <div class="hub"></div>
      </div>
      <div id="actions">
        <button type="button" id="btn-b" class="round b" aria-label="B, cancel">B</button>
        <button type="button" id="btn-a" class="round a" aria-label="A, confirm">A</button>
        <button type="button" id="btn-start" class="start" aria-label="Start">START</button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
